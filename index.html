<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>预约结果</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" sizes="192x192" href="./image/icon-192.png" />
    <link rel="apple-touch-icon" href="./image/apple-touch-icon.png" />
  </head>
  <body>
    <main class="phone" aria-label="预约结果页面">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" type="button" aria-label="返回" onclick="history.back()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15.5 19.5 8 12l7.5-7.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="icon-btn" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6L6 18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <h1 class="title">预约结果</h1>
        <div style="width: 56px"></div>
      </header>

      <section class="tip">
        <img class="tip-voice" src="./image/voice.png" alt="" aria-hidden="true" />
        <div>请务必在预约时间段 <span style="font-size: 16px; color: #d29853">前4分钟</span> 内进站</div>
      </section>

      <div class="card-area" aria-label="预约码区域">
        <div class="pull-refresh" id="pullRefresh" aria-hidden="true">
          <span>下拉刷新</span>
        </div>

        <section class="card" aria-label="预约码">
          <div class="card-inner">
            <div class="expires" aria-live="polite">
              <span class="expires-label">失效时间：</span>
              <span class="expires-value" id="countdown">--分--秒</span>
            </div>

            <div class="qr-wrap" aria-label="二维码区域">
              <div id="qrcode" class="qrcode" aria-label="二维码"></div>
            </div>

            <p class="qr-help">请凭此二维码，前往地铁站指定预约通道扫码进站</p>

            <div class="route">
              <span class="route-left">6号线</span>
              <span class="route-station">光电园站</span>
            </div>

            <div class="time">
              <span class="time-date" id="rideDate">2026-02-02</span>
              <span class="time-slot" id="rideSlot">18:10~18:20</span>
            </div>
          </div>
        </section>
      </div>
    </main>

    <img class="ma-fixed" src="./image/ma.png" alt="去乘车" />
    <img class="foot-fixed" src="./image/foot.png" alt="" aria-hidden="true" />

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
